name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore the signing key
        run: echo "$DEBUG_KEYSTORE_B64" | base64 -d > app/release.keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Name the APK with its version
        id: name
        run: |
          VERSION=$(grep -o "versionName '[^']*'" app/build.gradle | cut -d"'" -f2)
          BUILD=$(grep -o "versionCode [0-9]*" app/build.gradle | awk '{print $2}')
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/TelegramDownloader-v${VERSION}-build${BUILD}.apk"
          echo "tag=v${VERSION}-build${BUILD}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-downloader-apk
          path: out/*.apk

      - name: Publish the release the app checks for updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          name: Telegram Downloader ${{ steps.name.outputs.tag }}
          files: out/*.apk
